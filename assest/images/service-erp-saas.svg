<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="erpBg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#b98508" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#181307" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08090c" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cubeGoldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde48e"/>
      <stop offset="50%" stop-color="#b98508"/>
      <stop offset="100%" stop-color="#734e02"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2415"/>
      <stop offset="100%" stop-color="#0e0c08"/>
    </linearGradient>
    <filter id="erpGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#erpBg)"/>

  <!-- Perspective Isometric Ground Grid -->
  <g opacity="0.18" stroke="#b98508" stroke-width="1.2">
    <path d="M 80 520 L 300 380 L 520 520 L 300 660 Z"/>
    <path d="M 130 520 L 300 415 L 470 520 L 300 625 Z"/>
    <path d="M 180 520 L 300 450 L 420 520 L 300 590 Z"/>
  </g>

  <!-- Ambient Cloud Aura -->
  <circle cx="300" cy="300" r="140" fill="#b98508" opacity="0.25" filter="url(#erpGlow)"/>

  <!-- Isometric Server Towers & SaaS Cloud Architecture -->
  <!-- Left Server Tower -->
  <g transform="translate(170, 310)">
    <polygon points="0,0 50,-28 100,0 50,28" fill="#3a2f18" stroke="#b98508" stroke-width="1.2"/>
    <polygon points="0,0 0,140 50,168 50,28" fill="url(#serverGrad)" stroke="rgba(185,133,8,0.4)" stroke-width="1"/>
    <polygon points="50,28 50,168 100,140 100,0" fill="#14110b" stroke="rgba(185,133,8,0.4)" stroke-width="1"/>
    <!-- Glowing Server Slots -->
    <line x1="12" y1="38" x2="38" y2="52" stroke="#fde48e" stroke-width="2.5" filter="url(#erpGlow)"/>
    <line x1="12" y1="70" x2="38" y2="84" stroke="#b98508" stroke-width="2.5"/>
    <line x1="12" y1="102" x2="38" y2="116" stroke="#fde48e" stroke-width="2.5"/>
    <line x1="12" y1="134" x2="38" y2="148" stroke="#ffffff" stroke-width="2.5" filter="url(#erpGlow)"/>
  </g>

  <!-- Right Server Tower -->
  <g transform="translate(330, 310)">
    <polygon points="0,0 50,-28 100,0 50,28" fill="#3a2f18" stroke="#b98508" stroke-width="1.2"/>
    <polygon points="0,0 0,140 50,168 50,28" fill="url(#serverGrad)" stroke="rgba(185,133,8,0.4)" stroke-width="1"/>
    <polygon points="50,28 50,168 100,140 100,0" fill="#14110b" stroke="rgba(185,133,8,0.4)" stroke-width="1"/>
    <!-- Glowing Server Slots -->
    <line x1="62" y1="52" x2="88" y2="38" stroke="#fde48e" stroke-width="2.5" filter="url(#erpGlow)"/>
    <line x1="62" y1="84" x2="88" y2="70" stroke="#b98508" stroke-width="2.5"/>
    <line x1="62" y1="116" x2="88" y2="102" stroke="#fde48e" stroke-width="2.5"/>
    <line x1="62" y1="148" x2="88" y2="134" stroke="#ffffff" stroke-width="2.5" filter="url(#erpGlow)"/>
  </g>

  <!-- Center Floating Modular ERP Cloud Cube -->
  <g transform="translate(250, 190)">
    <!-- Top Face -->
    <polygon points="50,0 100,-28 150,0 100,28" fill="url(#cubeGoldTop)" stroke="#ffffff" stroke-width="1.5" filter="url(#erpGlow)"/>
    <polygon points="50,0 100,-28 150,0 100,28" fill="url(#cubeGoldTop)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Left Face -->
    <polygon points="50,0 50,100 100,128 100,28" fill="#b98508" stroke="#fde48e" stroke-width="1"/>
    <!-- Right Face -->
    <polygon points="100,28 100,128 150,100 150,0" fill="#694602" stroke="#fde48e" stroke-width="1"/>
    <!-- Center Node Core -->
    <circle cx="100" cy="0" r="8" fill="#ffffff" filter="url(#erpGlow)"/>
  </g>
</svg>
