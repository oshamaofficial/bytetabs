<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="perfBg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#b98508" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#181206" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08090c" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldFunnel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde48e"/>
      <stop offset="50%" stop-color="#b98508"/>
      <stop offset="100%" stop-color="#694602"/>
    </linearGradient>
    <linearGradient id="perfLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#734e02"/>
      <stop offset="50%" stop-color="#fdd166"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="glassTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="perfGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#perfBg)"/>

  <!-- Radial Concentric Target Rings -->
  <circle cx="300" cy="320" r="220" fill="none" stroke="rgba(185,133,8,0.12)" stroke-width="1.5"/>
  <circle cx="300" cy="320" r="160" fill="none" stroke="rgba(185,133,8,0.2)" stroke-width="1.5"/>
  <circle cx="300" cy="320" r="100" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
  <circle cx="300" cy="320" r="50" fill="none" stroke="#fde48e" stroke-width="2.5" filter="url(#perfGlow)"/>

  <!-- Central Ambient Glow -->
  <circle cx="300" cy="320" r="120" fill="#b98508" opacity="0.22" filter="url(#perfGlow)"/>

  <!-- 3D Layered High-ROAS Conversion Funnel -->
  <g transform="translate(300, 260)">
    <!-- Top Funnel Rim -->
    <ellipse cx="0" cy="-70" rx="150" ry="22" fill="url(#glassTop)" stroke="rgba(255,255,255,0.45)" stroke-width="1.8"/>
    <!-- Funnel Upper Body -->
    <path d="M -150 -70 L 150 -70 L 105 -5 L -105 -5 Z" fill="url(#glassTop)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2"/>
    <ellipse cx="0" cy="-5" rx="105" ry="16" fill="rgba(185,133,8,0.18)" stroke="#fde48e" stroke-width="1.2"/>

    <!-- Funnel Middle Body -->
    <path d="M -105 -5 L 105 -5 L 60 65 L -60 65 Z" fill="url(#glassTop)" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>
    <ellipse cx="0" cy="65" rx="60" ry="11" fill="rgba(185,133,8,0.25)" stroke="#fde48e" stroke-width="1.5"/>

    <!-- Funnel Lower Tip (Conversion Core) -->
    <path d="M -60 65 L 60 65 L 20 135 L -20 135 Z" fill="url(#goldFunnel)" filter="url(#perfGlow)"/>
    <path d="M -60 65 L 60 65 L 20 135 L -20 135 Z" fill="url(#goldFunnel)"/>
    <ellipse cx="0" cy="135" rx="20" ry="6" fill="#ffffff" filter="url(#perfGlow)"/>
  </g>

  <!-- Exponential ROAS Trajectory Line -->
  <path d="M 80 480 Q 200 450, 280 340 T 430 190 T 520 100" fill="none" stroke="url(#perfLine)" stroke-width="4.5" filter="url(#perfGlow)"/>
  <circle cx="280" cy="340" r="6" fill="#fde48e" filter="url(#perfGlow)"/>
  <circle cx="430" cy="190" r="7" fill="#ffffff" filter="url(#perfGlow)"/>
  <circle cx="520" cy="100" r="10" fill="#ffffff" filter="url(#perfGlow)"/>
</svg>
