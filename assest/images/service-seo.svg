<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="seoBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#b98508" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#1c1407" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090a0d" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="barGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#734e02"/>
      <stop offset="50%" stop-color="#b98508"/>
      <stop offset="100%" stop-color="#fde48e"/>
    </linearGradient>
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#fed678" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="curveGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b98508" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#fdd166" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="seoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="600" height="800" fill="url(#seoBg)"/>

  <!-- Radial Aura Glow -->
  <circle cx="300" cy="330" r="180" fill="#b98508" opacity="0.22" filter="url(#seoGlow)"/>

  <!-- 3D Perspective Grid -->
  <g opacity="0.18" stroke="#b98508" stroke-width="1.2">
    <line x1="60" y1="520" x2="540" y2="520"/>
    <line x1="90" y1="560" x2="510" y2="560"/>
    <line x1="130" y1="600" x2="470" y2="600"/>
    <line x1="300" y1="420" x2="60" y2="660"/>
    <line x1="300" y1="420" x2="180" y2="660"/>
    <line x1="300" y1="420" x2="300" y2="660"/>
    <line x1="300" y1="420" x2="420" y2="660"/>
    <line x1="300" y1="420" x2="540" y2="660"/>
  </g>

  <!-- 3D Bar Chart Elements (Ranking Growth) -->
  <g transform="translate(300, 360)">
    <rect x="-160" y="-40" width="36" height="120" rx="8" fill="url(#barGold)" opacity="0.7"/>
    <rect x="-105" y="-80" width="36" height="160" rx="8" fill="url(#barGold)" opacity="0.82"/>
    <rect x="-50" y="-130" width="36" height="210" rx="8" fill="url(#barGold)" opacity="0.92"/>
    <rect x="5" y="-190" width="38" height="270" rx="8" fill="url(#barGold)" filter="url(#seoGlow)"/>
    <rect x="5" y="-190" width="38" height="270" rx="8" fill="url(#barGold)"/>
    <rect x="65" y="-110" width="36" height="190" rx="8" fill="url(#barGold)" opacity="0.85"/>
    <rect x="120" y="-60" width="36" height="140" rx="8" fill="url(#barGold)" opacity="0.75"/>
  </g>

  <!-- Exponential Growth Curve -->
  <path d="M 120 440 Q 230 400, 305 270 T 480 160" fill="none" stroke="url(#curveGlow)" stroke-width="4" filter="url(#seoGlow)"/>
  <circle cx="305" cy="270" r="6" fill="#fde48e" filter="url(#seoGlow)"/>
  <circle cx="480" cy="160" r="9" fill="#ffffff" filter="url(#seoGlow)"/>

  <!-- High-End Glass Search Magnifier -->
  <g transform="translate(340, 240)">
    <circle cx="0" cy="0" r="70" fill="url(#lensGlass)" stroke="rgba(255,255,255,0.45)" stroke-width="2.5" filter="url(#seoGlow)"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#fde48e" stroke-width="1.8" opacity="0.6"/>
    <!-- Target Crosshairs -->
    <line x1="-30" y1="0" x2="-10" y2="0" stroke="#fed678" stroke-width="2" opacity="0.8"/>
    <line x1="10" y1="0" x2="30" y2="0" stroke="#fed678" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="-30" x2="0" y2="-10" stroke="#fed678" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="10" x2="0" y2="30" stroke="#fed678" stroke-width="2" opacity="0.8"/>
    <!-- Magnifier Handle -->
    <path d="M 48 50 L 95 102" stroke="#fed678" stroke-width="9" stroke-linecap="round" filter="url(#seoGlow)"/>
    <path d="M 48 50 L 95 102" stroke="#b98508" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- #1 Rank Badge inside Magnifier -->
  <g transform="translate(340, 240)">
    <text x="0" y="8" fill="#ffffff" font-family="'Quicksand', sans-serif" font-size="24" font-weight="700" text-anchor="middle" filter="url(#seoGlow)">#1</text>
  </g>
</svg>
