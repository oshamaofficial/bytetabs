<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 38" fill="none" width="170" height="38" aria-label="ByteTabs Logo">
  <!-- ByteTabs Geometric Icon Mark -->
  <g id="logo-mark">
    <!-- Base Charcoal Tab Layer -->
    <rect x="2" y="7" width="22" height="24" rx="6" fill="#121316"/>
    <path d="M7 14H19" stroke="#FAF8F5" stroke-width="2" stroke-linecap="round"/>
    <path d="M7 19H15" stroke="#FAF8F5" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Signature Gold Accent Tab (#b98508) Layer -->
    <rect x="12" y="3" width="20" height="22" rx="5" fill="#B98508" fill-opacity="0.95"/>
    <circle cx="22" cy="11" r="2.5" fill="#FAF8F5"/>
    <path d="M17 17H27" stroke="#FAF8F5" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Wordmark "ByteTabs" -->
  <g id="logo-text" fill="#121316">
    <text x="42" y="26" font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.03em">Byte<tspan fill="#121316" font-weight="500">Tabs</tspan></text>
    <!-- Refined Accent Signature Dot -->
    <circle cx="140" cy="16" r="2.5" fill="#B98508"/>
  </g>
</svg>
